<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tempo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6470"/>
      <stop offset="1" stop-color="#3A414D"/>
    </linearGradient>
  </defs>
  <!-- Rounded app tile -->
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <!-- Rising rhythm: three ascending rounded bars = tempo + momentum.
       All bars share a baseline at y=384; tops ascend left to right. -->
  <rect x="150" y="288" width="48" height="96"  rx="24" fill="#F4F1EA"/>
  <rect x="232" y="216" width="48" height="168" rx="24" fill="#F4F1EA"/>
  <rect x="314" y="128" width="48" height="256" rx="24" fill="#E07856"/>
</svg>
