<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tempo · /debuggrid</title>
<style>
  /* Breakpoints mirror the --bp-* tokens in styles.css (sm480 md768 lg1024 xl1280 xxl1440). */
  :root { --bg:#0f1115; --card:#1a1d24; --ink:#eef1f6; --muted:#9aa3b2; --accent:#7c8cff; --ok:#4ade80; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .panel { background: var(--card); border-radius: 16px; padding: 22px; width: 100%; max-width: 460px; box-shadow: 0 20px 50px -20px #000; }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .big { font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .bp { display: inline-block; margin-top: 6px; padding: 4px 12px; border-radius: 999px; background: var(--accent); color: #0b0d12; font-weight: 800; font-size: 14px; }
  .rows { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13px; }
  .rows dt { color: var(--muted); }
  .rows dd { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .scale { margin-top: 18px; display: flex; height: 30px; border-radius: 8px; overflow: hidden; border: 1px solid #2a2e38; }
  .scale span { flex: 1; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: var(--muted); border-right: 1px solid #2a2e38; }
  .scale span.active { background: var(--accent); color: #0b0d12; }
  .scale span:last-child { border-right: none; }
  a { color: var(--accent); font-size: 12px; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Tempo — responsive debug grid</h1>
    <div class="sub">Resize / rotate to watch the active breakpoint change. Not linked anywhere.</div>
    <div class="big" id="dim">–</div>
    <div><span class="bp" id="bp">–</span></div>
    <div class="scale" id="scale"></div>
    <dl class="rows">
      <dt>Breakpoint range</dt><dd id="range">–</dd>
      <dt>Pointer</dt><dd id="pointer">–</dd>
      <dt>Hover</dt><dd id="hover">–</dd>
      <dt>Display mode</dt><dd id="display">–</dd>
      <dt>Device pixel ratio</dt><dd id="dpr">–</dd>
      <dt>Orientation</dt><dd id="orient">–</dd>
    </dl>
    <p style="margin-top:16px"><a href="/">← Back to Tempo</a></p>
  </div>
<script>
  const BP = [
    { name: 'base', min: 0,    max: 479 },
    { name: 'sm',   min: 480,  max: 767 },
    { name: 'md',   min: 768,  max: 1023 },
    { name: 'lg',   min: 1024, max: 1279 },
    { name: 'xl',   min: 1280, max: 1439 },
    { name: 'xxl',  min: 1440, max: Infinity },
  ];
  const scale = document.getElementById('scale');
  BP.forEach((b) => { const s = document.createElement('span'); s.textContent = b.name; s.dataset.name = b.name; scale.appendChild(s); });
  const dispMode = () => ['window-controls-overlay','standalone','minimal-ui','fullscreen']
    .find((m) => matchMedia('(display-mode: ' + m + ')').matches) || 'browser';
  function update() {
    const w = window.innerWidth, h = window.innerHeight;
    const bp = BP.find((b) => w >= b.min && w <= b.max);
    document.getElementById('dim').textContent = w + ' × ' + h;
    document.getElementById('bp').textContent = bp.name;
    document.getElementById('range').textContent = bp.min + '–' + (bp.max === Infinity ? '∞' : bp.max) + ' px';
    document.getElementById('pointer').textContent = matchMedia('(pointer: fine)').matches ? 'fine (mouse/trackpad)' : matchMedia('(pointer: coarse)').matches ? 'coarse (touch)' : 'none';
    document.getElementById('hover').textContent = matchMedia('(hover: hover)').matches ? 'yes' : 'no';
    document.getElementById('display').textContent = dispMode();
    document.getElementById('dpr').textContent = String(window.devicePixelRatio || 1);
    document.getElementById('orient').textContent = w >= h ? 'landscape' : 'portrait';
    [...scale.children].forEach((s) => s.classList.toggle('active', s.dataset.name === bp.name));
  }
  addEventListener('resize', update); addEventListener('orientationchange', update); update();
</script>
</body>
</html>
